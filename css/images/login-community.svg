<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" preserveAspectRatio="xMidYMax slice">
  <!-- Subtle barangay skyline for the login brand panel (white, low opacity). -->
  <g fill="#ffffff">
    <!-- far row: taller buildings -->
    <g fill-opacity="0.07">
      <rect x="40" y="70" width="70" height="190" rx="4"/>
      <rect x="250" y="40" width="60" height="220" rx="4"/>
      <rect x="470" y="60" width="80" height="200" rx="4"/>
      <rect x="660" y="80" width="64" height="180" rx="4"/>
    </g>
    <!-- windows of the far row -->
    <g fill-opacity="0.06">
      <rect x="54" y="88" width="14" height="14" rx="2"/><rect x="82" y="88" width="14" height="14" rx="2"/>
      <rect x="54" y="116" width="14" height="14" rx="2"/><rect x="82" y="116" width="14" height="14" rx="2"/>
      <rect x="262" y="58" width="12" height="14" rx="2"/><rect x="286" y="58" width="12" height="14" rx="2"/>
      <rect x="262" y="86" width="12" height="14" rx="2"/><rect x="286" y="86" width="12" height="14" rx="2"/>
      <rect x="486" y="78" width="16" height="14" rx="2"/><rect x="518" y="78" width="16" height="14" rx="2"/>
      <rect x="486" y="106" width="16" height="14" rx="2"/><rect x="518" y="106" width="16" height="14" rx="2"/>
      <rect x="676" y="98" width="12" height="14" rx="2"/><rect x="698" y="98" width="12" height="14" rx="2"/>
    </g>

    <!-- near row: small houses with roofs -->
    <g fill-opacity="0.12">
      <rect x="120" y="170" width="90" height="90" rx="3"/>
      <path d="M110 174 L165 128 L220 174 Z"/>
      <rect x="330" y="182" width="80" height="78" rx="3"/>
      <path d="M320 186 L370 146 L420 186 Z"/>
      <rect x="560" y="176" width="86" height="84" rx="3"/>
      <path d="M550 180 L603 136 L656 180 Z"/>
    </g>
    <!-- doors and windows of the houses (cut-outs drawn slightly lighter) -->
    <g fill-opacity="0.1">
      <rect x="155" y="214" width="20" height="46" rx="3"/>
      <rect x="130" y="186" width="18" height="16" rx="2"/><rect x="182" y="186" width="18" height="16" rx="2"/>
      <rect x="360" y="220" width="20" height="40" rx="3"/>
      <rect x="590" y="216" width="22" height="44" rx="3"/>
      <rect x="620" y="192" width="16" height="16" rx="2"/>
    </g>

    <!-- trees -->
    <g fill-opacity="0.13">
      <rect x="236" y="200" width="8" height="60" rx="3"/>
      <circle cx="240" cy="188" r="26"/><circle cx="224" cy="204" r="16"/><circle cx="256" cy="204" r="16"/>
      <rect x="446" y="208" width="8" height="52" rx="3"/>
      <circle cx="450" cy="196" r="22"/><circle cx="436" cy="210" r="14"/><circle cx="464" cy="210" r="14"/>
      <rect x="736" y="204" width="8" height="56" rx="3"/>
      <circle cx="740" cy="192" r="24"/><circle cx="726" cy="208" r="15"/><circle cx="754" cy="208" r="15"/>
      <rect x="16" y="214" width="7" height="46" rx="3"/>
      <circle cx="20" cy="204" r="18"/>
    </g>

    <!-- bushes and ground -->
    <g fill-opacity="0.1">
      <circle cx="300" cy="258" r="16"/><circle cx="318" cy="254" r="18"/>
      <circle cx="520" cy="258" r="14"/><circle cx="536" cy="255" r="16"/>
      <circle cx="680" cy="258" r="14"/>
      <rect x="0" y="252" width="800" height="8"/>
    </g>
  </g>
</svg>
